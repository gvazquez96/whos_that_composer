{% extends "layout.html" %}

{% block content %}
<div class="nes-container with-title">
    <p class="title">Iniciar sesión</p>
    <form action="/validate_user" method="POST">
        <div class="nes-field">
            <label for="user">Usuario</label>
            <input type="text" id="user" name="user" class="nes-input" placeholder="usuario">
        </div>
        <div class="nes-field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="nes-input" placeholder="contraseña">
        </div>
        <button type="submit" class="nes-btn is-primary">Entrar</button>
    </form>
</div>
<p><a href="/">Volver al inicio</a></p>
{% endblock %}
